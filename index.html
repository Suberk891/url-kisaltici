<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>✨ Süper URL Kısaltıcı | HTTP Linkler</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            transition: all 0.3s;
        }

        body.dark {
            background: linear-gradient(135deg, #1e1e2e 0%, #2d1b4e 100%);
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
        }

        /* Ana kart */
        .main-card {
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            margin-bottom: 30px;
        }

        body.dark .main-card {
            background: #2d2d3d;
            color: #e0e0e0;
        }

        /* Header */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        h1 {
            color: #333;
            font-size: 2em;
        }

        body.dark h1 {
            color: #e0e0e0;
        }

        .theme-toggle {
            background: #667eea;
            border: none;
            padding: 10px 20px;
            border-radius: 10px;
            cursor: pointer;
            color: white;
            font-size: 16px;
            width: auto;
        }

        /* Input alanı */
        .url-input-area {
            background: #f8f9fa;
            padding: 30px;
            border-radius: 15px;
            margin-bottom: 20px;
        }

        body.dark .url-input-area {
            background: #3d3d4d;
        }

        .input-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #555;
            font-weight: 500;
        }

        body.dark label {
            color: #ccc;
        }

        input[type="url"], select {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            font-size: 16px;
            transition: border-color 0.3s;
        }

        body.dark input, body.dark select {
            background: #2d2d3d;
            color: #e0e0e0;
            border-color: #4a4a5a;
        }

        input:focus {
            outline: none;
            border-color: #667eea;
        }

        .row-2cols {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        button {
            width: 100%;
            padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: transform 0.2s;
        }

        button:hover {
            transform: translateY(-2px);
        }

        /* Sonuç kartı */
        .result-card {
            margin-top: 20px;
            padding: 20px;
            background: linear-gradient(135deg, #e8f0fe 0%, #f0e8fe 100%);
            border-radius: 15px;
            display: none;
        }

        body.dark .result-card {
            background: linear-gradient(135deg, #1e3a5f 0%, #3d2b5f 100%);
        }

        .result-card.show {
            display: block;
            animation: fadeIn 0.5s;
        }

        .short-url-box {
            display: flex;
            gap: 10px;
            margin: 15px 0;
        }

        .short-url-box input {
            flex: 1;
            background: white;
        }

        .qr-code {
            text-align: center;
            margin-top: 15px;
            padding: 10px;
            background: white;
            border-radius: 10px;
            display: inline-block;
        }

        body.dark .qr-code {
            background: #2d2d3d;
        }

        /* Link listesi */
        .links-section {
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }

        body.dark .links-section {
            background: #2d2d3d;
        }

        .search-bar {
            margin-bottom: 20px;
        }

        .search-bar input {
            width: 100%;
            padding: 12px;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }

        .stat-card h3 {
            font-size: 24px;
        }

        .url-item {
            background: #f8f9fa;
            padding: 15px;
            margin-bottom: 15px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
        }

        body.dark .url-item {
            background: #3d3d4d;
        }

        .url-item strong {
            color: #667eea;
        }

        .url-meta {
            display: flex;
            gap: 20px;
            margin-top: 10px;
            font-size: 12px;
            color: #666;
            flex-wrap: wrap;
        }

        body.dark .url-meta {
            color: #aaa;
        }

        .click-count {
            background: #28a745;
            color: white;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 11px;
        }

        .expired {
            opacity: 0.5;
            background: #dc3545;
        }

        .category-badge {
            background: #667eea;
            color: white;
            padding: 2px 8px;
            border-radius: 20px;
            font-size: 11px;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-card">
            <div class="header">
                <div>
                    <h1>✨ Süper URL Kısaltıcı</h1>
                    <p>HTTP protokolü ile kısaltılmış linkler</p>
                </div>
                <button class="theme-toggle" onclick="toggleTheme()">🌙 Tema Değiştir</button>
            </div>

            <div class="url-input-area">
                <div class="input-group">
                    <label>🔗 Uzun URL girin:</label>
                    <input type="url" id="longUrl" placeholder="http://ornek.com/uzun-link" value="http://">
                </div>

                <div class="row-2cols">
                    <div class="input-group">
                        <label>🏷️ Kategori:</label>
                        <select id="category">
                            <option value="Genel">Genel</option>
                            <option value="Sosyal Medya">Sosyal Medya</option>
                            <option value="Alışveriş">Alışveriş</option>
                            <option value="Eğitim">Eğitim</option>
                            <option value="Eğlence">Eğlence</option>
                            <option value="İş">İş</option>
                        </select>
                    </div>
                    <div class="input-group">
                        <label>⏰ Link süresi (gün):</label>
                        <select id="expiryDays">
                            <option value="0">Süresiz</option>
                            <option value="1">1 gün</option>
                            <option value="7">7 gün</option>
                            <option value="30">30 gün</option>
                            <option value="90">90 gün</option>
                        </select>
                    </div>
                </div>

                <button onclick="shortenUrl()">🚀 URL Kısalt</button>

                <div class="result-card" id="result">
                    <h3>✅ Linkin Hazır!</h3>
                    <div class="short-url-box">
                        <input type="text" id="shortUrl" readonly>
                        <button class="copy-btn" onclick="copyToClipboard()" style="width: auto; padding: 12px 20px;">📋 Kopyala</button>
                    </div>
                    <div id="qrContainer" style="text-align: center;"></div>
                </div>
            </div>
        </div>

        <div class="links-section">
            <div class="stats">
                <div class="stat-card">
                    <div>📊 Toplam Link</div>
                    <h3 id="totalLinks">0</h3>
                </div>
                <div class="stat-card">
                    <div>👆 Toplam Tıklanma</div>
                    <h3 id="totalClicks">0</h3>
                </div>
                <div class="stat-card">
                    <div>🔥 En Popüler</div>
                    <h3 id="popularLink">-</h3>
                </div>
            </div>

            <div class="search-bar">
                <input type="text" id="searchInput" placeholder="🔍 Linklerde ara..." onkeyup="filterLinks()">
            </div>

            <div class="url-list" id="urlList">
                <h3>📋 Linklerim</h3>
                <div id="linksContainer"></div>
                <button class="clear-btn" onclick="clearAll()" style="background: #dc3545; margin-top: 10px;">🗑️ Tümünü Temizle</button>
            </div>
        </div>
    </div>

    <script>
        let shortenedUrls = JSON.parse(localStorage.getItem('shortenedUrls')) || [];
        const chars = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';
        const baseUrl = window.location.origin + window.location.pathname;

        function generateShortCode() {
            let code = '';
            for (let i = 0; i < 4; i++) {
                code += chars.charAt(Math.floor(Math.random() * chars.length));
            }
            return code;
        }

        function formatUrl(url) {
            if (url.startsWith('https://')) {
                url = 'http://' + url.slice(8);
            } else if (!url.startsWith('http://') && !url.startsWith('https://')) {
                url = 'http://' + url;
            }
            return url;
        }

        function shortenUrl() {
            let longUrl = document.getElementById('longUrl').value.trim();
            let category = document.getElementById('category').value;
            let expiryDays = parseInt(document.getElementById('expiryDays').value);
            
            if (!longUrl) {
                alert('Lütfen bir URL girin!');
                return;
            }
            
            longUrl = formatUrl(longUrl);
            
            let existing = shortenedUrls.find(item => item.longUrl === longUrl);
            if (existing && !isExpired(existing)) {
                alert('Bu URL zaten kısaltılmış!');
                displayResult(existing);
                return;
            }
            
            let shortCode = generateShortCode();
            let expiryDate = expiryDays > 0 ? new Date(Date.now() + expiryDays * 86400000).toISOString() : null;
            
            let newLink = {
                code: shortCode,
                longUrl: longUrl,
                shortUrl: baseUrl + '?code=' + shortCode,
                date: new Date().toLocaleString(),
                category: category,
                expiryDate: expiryDate,
                clicks: 0,
                timestamp: Date.now()
            };
            
            shortenedUrls.unshift(newLink);
            localStorage.setItem('shortenedUrls', JSON.stringify(shortenedUrls));
            displayResult(newLink);
            updateUrlList();
            updateStats();
            
            document.getElementById('longUrl').value = 'http://';
        }

        function displayResult(link) {
            const resultDiv = document.getElementById('result');
            const shortUrlInput = document.getElementById('shortUrl');
            shortUrlInput.value = link.shortUrl;
            resultDiv.classList.add('show');
            
            // QR Code oluştur
            generateQRCode(link.shortUrl);
        }

        function generateQRCode(url) {
            const qrContainer = document.getElementById('qrContainer');
            const qrUrl = `https://api.qrserver.com/v1/create-qr-code/?size=100x100&data=${encodeURIComponent(url)}`;
            qrContainer.innerHTML = `<div class="qr-code"><img src="${qrUrl}" alt="QR Code"><br><small>QR Kodu Tara</small></div>`;
        }

        function copyToClipboard() {
            const shortUrlInput = document.getElementById('shortUrl');
            shortUrlInput.select();
            document.execCommand('copy');
            alert('✅ Link kopyalandı!');
        }

        function isExpired(link) {
            if (!link.expiryDate) return false;
            return new Date(link.expiryDate) < new Date();
        }

        function updateUrlList() {
            const container = document.getElementById('linksContainer');
            const searchTerm = document.getElementById('searchInput')?.value.toLowerCase() || '';
            
            let filtered = shortenedUrls.filter(item => 
                item.longUrl.toLowerCase().includes(searchTerm) ||
                item.category.toLowerCase().includes(searchTerm) ||
                item.code.toLowerCase().includes(searchTerm)
            );
            
            if (filtered.length === 0) {
                container.innerHTML = '<p style="color: #999; text-align: center;">Henüz kısaltılmış link yok.</p>';
                return;
            }
            
            container.innerHTML = filtered.map(item => {
                const expired = isExpired(item);
                return `
                    <div class="url-item ${expired ? 'expired' : ''}">
                        <div>
                            <strong>🔗 ${item.shortUrl}</strong>
                            <span class="category-badge">${item.category}</span>
                            <span class="click-count">👆 ${item.clicks || 0} tıklanma</span>
                        </div>
                        <div><strong>📎 Hedef:</strong> ${item.longUrl}</div>
                        <div class="url-meta">
                            <span>📅 Oluşturulma: ${item.date}</span>
                            ${item.expiryDate ? `<span>⏰ Son kullanma: ${new Date(item.expiryDate).toLocaleDateString()}</span>` : '<span>♾️ Süresiz</span>'}
                            ${expired ? '<span style="color: red;">⚠️ SÜRESİ DOLDU</span>' : ''}
                        </div>
                    </div>
                `;
            }).join('');
        }

        function filterLinks() {
            updateUrlList();
        }

        function updateStats() {
            document.getElementById('totalLinks').textContent = shortenedUrls.length;
            const totalClicks = shortenedUrls.reduce((sum, item) => sum + (item.clicks || 0), 0);
            document.getElementById('totalClicks').textContent = totalClicks;
            
            const mostClicked = [...shortenedUrls].sort((a, b) => (b.clicks || 0) - (a.clicks || 0))[0];
            if (mostClicked) {
                document.getElementById('popularLink').textContent = mostClicked.code + ` (${mostClicked.clicks || 0})`;
            }
        }

        function clearAll() {
            if (confirm('Tüm linkleri silmek istediğinize emin misiniz?')) {
                shortenedUrls = [];
                localStorage.setItem('shortenedUrls', JSON.stringify(shortenedUrls));
                updateUrlList();
                updateStats();
                document.getElementById('result').classList.remove('show');
                alert('Tüm linkler temizlendi!');
            }
        }

        function toggleTheme() {
            document.body.classList.toggle('dark');
            const btn = document.querySelector('.theme-toggle');
            if (document.body.classList.contains('dark')) {
                btn.textContent = '☀️ Açık Tema';
            } else {
                btn.textContent = '🌙 Koyu Tema';
            }
        }

        function handleRedirect() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get('code');
            if (code) {
                const found = shortenedUrls.find(item => item.code === code);
                if (found && !isExpired(found)) {
                    found.clicks = (found.clicks || 0) + 1;
                    localStorage.setItem('shortenedUrls', JSON.stringify(shortenedUrls));
                    window.location.href = found.longUrl;
                } else if (found && isExpired(found)) {
                    alert('Bu linkin süresi dolmuştur!');
                    window.location.href = '/';
                } else {
                    alert('Geçersiz link!');
                    window.location.href = '/';
                }
            }
        }

        updateUrlList();
        updateStats();
        handleRedirect();
        
        document.getElementById('longUrl').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                shortenUrl();
            }
        });
    </script>
</body>
</html>
